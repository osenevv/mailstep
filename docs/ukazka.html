<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mailstep · Interaktivní ukázka rozhodování jobu</title>
  <style>
    :root {
      --bg: #eceae3;
      --surface: #f9f8f5;
      --card: #ffffff;
      --ink: #14171a;
      --ink-muted: #535c65;
      --border: #14171a;
      --border-subtle: #d3d0c7;
      --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      
      --file-ink: #0b5432;
      --file-bg: #e6f4ea;
      --file-border: #0b5432;

      --stop-ink: #7a1f1d;
      --stop-bg: #fce8e6;
      --stop-border: #7a1f1d;

      --human-ink: #7c4a03;
      --human-bg: #fef7e0;
      --human-border: #7c4a03;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      line-height: 1.45;
      padding-bottom: 40px;
    }

    header.topbar {
      border-bottom: 2px solid var(--border);
      background: var(--surface);
      padding: 20px 32px 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand-title {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin: 0 0 4px;
    }

    h1.heading {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .meta-subtitle {
      margin: 2px 0 0;
      font-size: 13px;
      color: var(--ink-muted);
    }

    .tally-summary {
      display: flex;
      gap: 12px;
      font-family: var(--mono);
      font-size: 12px;
    }

    .tally-pill {
      padding: 6px 12px;
      border: 1px solid var(--border);
      background: var(--card);
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .tally-pill strong {
      font-size: 16px;
      font-weight: 700;
    }

    .tally-file { background: var(--file-bg); border-color: var(--file-border); color: var(--file-ink); }
    .tally-human { background: var(--human-bg); border-color: var(--human-border); color: var(--human-ink); }
    .tally-stop { background: var(--stop-bg); border-color: var(--stop-border); color: var(--stop-ink); }

    /* Case Selector Navigation */
    nav.case-nav {
      padding: 16px 32px 0;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .nav-label {
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-right: 8px;
    }

    .case-btn {
      appearance: none;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 12px;
      padding: 8px 14px;
      cursor: pointer;
      border-radius: 0;
      transition: background 0.1s, color 0.1s;
    }

    .case-btn:hover {
      background: #e4e1d7;
    }

    .case-btn[aria-selected="true"] {
      background: var(--border);
      color: #ffffff;
      font-weight: 700;
    }

    .case-btn:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    .nav-hint {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-muted);
    }

    /* Desk Layout */
    main.desk {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr) minmax(240px, 0.85fr);
      gap: 20px;
      padding: 20px 32px;
      align-items: stretch;
    }

    .panel {
      background: var(--card);
      border: 2px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .panel-kicker {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin: 0 0 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .order-id {
      margin: 0;
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .client-name {
      margin: 2px 0 16px;
      font-size: 14px;
      color: var(--ink-muted);
    }

    dl.spec-grid {
      margin: 0;
      display: grid;
      gap: 10px;
      font-size: 13px;
    }

    dl.spec-grid div {
      display: grid;
      grid-template-columns: 100px minmax(0, 1fr);
      gap: 8px;
    }

    dl.spec-grid dt {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--ink-muted);
    }

    dl.spec-grid dd {
      margin: 0;
      font-weight: 500;
    }

    /* Tracking Panel */
    .carrier-header {
      background: #1e262f;
      color: #ffffff;
      padding: 8px 12px;
      font-family: var(--mono);
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .carrier-header.rp { background: #1a365d; }
    .carrier-header.pn { background: #5c2d1b; }
    .carrier-header.vc { background: #1f4e38; }
    .carrier-header.np { background: #3b3a30; }

    .events-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-bottom: auto;
    }

    .events-table th {
      text-align: left;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-muted);
      padding: 6px 8px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .events-table td {
      padding: 8px;
      border-bottom: 1px solid var(--border-subtle);
      vertical-align: top;
    }

    .events-table tr.active td {
      background: #fff8db;
      font-weight: 600;
    }

    .events-table td.when {
      font-family: var(--mono);
      font-size: 12px;
      white-space: nowrap;
      width: 130px;
    }

    .tracking-fallback-msg {
      padding: 24px 16px;
      background: var(--surface);
      border: 1px dashed var(--border-subtle);
      font-size: 13px;
      color: var(--ink-muted);
      text-align: center;
      margin-bottom: auto;
    }

    .tracking-fallback-msg strong {
      display: block;
      color: var(--ink);
      margin-bottom: 4px;
      font-family: var(--mono);
    }

    .tracking-footer {
      margin-top: 16px;
      padding-top: 8px;
      border-top: 1px solid var(--border-subtle);
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-muted);
    }

    /* Decision Stamp */
    .decision-panel {
      border: 2px solid var(--border);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .decision-panel.file { background: var(--file-bg); border-color: var(--file-border); color: var(--file-ink); }
    .decision-panel.stop { background: var(--stop-bg); border-color: var(--stop-border); color: var(--stop-ink); }
    .decision-panel.human { background: var(--human-bg); border-color: var(--human-border); color: var(--human-ink); }

    .decision-badge {
      display: inline-block;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 3px 8px;
      border: 1px solid currentColor;
      margin-bottom: 12px;
      align-self: center;
    }

    .decision-verb {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      line-height: 1;
      margin: 0 0 10px;
    }

    .decision-code {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      word-break: break-all;
      margin: 0 0 16px;
    }

    .decision-why {
      font-size: 13px;
      line-height: 1.4;
      margin: 0;
      padding-top: 12px;
      border-top: 1px solid currentColor;
      text-align: left;
    }

    @media (max-width: 960px) {
      main.desk { grid-template-columns: 1fr; }
      header.topbar { flex-direction: column; align-items: flex-start; }
      .nav-hint { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div>
      <p class="brand-title">Mailstep Automation · Kontrola reklamací</p>
      <h1 class="heading">Ranní vyhodnocení objednávek</h1>
      <p class="meta-subtitle">Export objednávek: 3. 11. 2026 06:00 · Režim: Stínová fronta (bez zápisu)</p>
    </div>
    <div class="tally-summary">
      <div class="tally-pill tally-file"><strong>12</strong> Založit</div>
      <div class="tally-pill tally-human"><strong>7</strong> Člověk</div>
      <div class="tally-pill tally-stop"><strong>26</strong> Nezakládat</div>
    </div>
  </header>

  <nav class="case-nav" role="tablist" aria-label="Výběr testovacího scénáře">
    <span class="nav-label">Scénáře:</span>
    <div id="buttonGroup" style="display:flex; flex-wrap:wrap; gap:6px;"></div>
    <span class="nav-hint">Klávesy: ← / →</span>
  </nav>

  <main class="desk" id="desk"></main>

  <script>
    const cases = [
      {
        id: "MS-2026-000101",
        label: "Ztráta (B)",
        client: "Lumen obchod",
        state: "převzato dopravcem",
        time: "24 d 1 h 0 min (limit ≥ 14 d)",
        method: "Rychlopost Standard",
        blocks: "žádné",
        rules: "Definice B · ztráta",
        reporter: "Eva Králová (matice)",
        carrier: "Rychlopost",
        carrierClass: "rp",
        tracking: "RP1001",
        headers: ["Čas skenu", "Událost"],
        rows: [["03.11.2026 08:00", "V přepravě", true]],
        footer: "Zdroj: HTML stránka dopravce po retracku",
        verb: "Založit",
        kind: "file",
        code: "TRACKING_CONFIRMS_STUCK",
        why: "Objednávka splňuje Definici B (14 dní) a čerstvá stránka dopravce potvrzuje, že balíček je stále v přepravě."
      },
      {
        id: "MS-2026-000104",
        label: "Nevyzvednuto (A)",
        client: "Lumen obchod",
        state: "čeká na dopravce",
        time: "4 d 0 h 0 min (limit ≥ 2 d)",
        method: "Rychlopost Standard",
        blocks: "žádné",
        rules: "Definice A · nevyzvednuto",
        reporter: "Eva Králová (matice)",
        carrier: "Rychlopost",
        carrierClass: "rp",
        tracking: "RP1004",
        emptyTitle: "Zásilka evidována, žádný sken převzetí",
        emptyDesc: "Dopravce zná číslo balíčku z EDI, ale nikdy neproběhl svozový sken na depu.",
        footer: "Zdroj: HTML stránka dopravce (šablona známa)",
        verb: "Založit",
        kind: "file",
        code: "TRACKING_CONFIRMS_NOT_PICKED_UP",
        why: "Pozitivní signál no_carrier_events: dopravce balíček eviduje, ale ani po 4 dnech ho nepřevzal."
      },
      {
        id: "MS-2026-000105",
        label: "Už jela (A)",
        client: "Lumen obchod",
        state: "čeká na dopravce",
        time: "4 d 0 h 0 min (limit ≥ 2 d)",
        method: "Rychlopost Standard",
        blocks: "žádné",
        rules: "Definice A · nevyzvednuto",
        reporter: "Eva Králová (matice)",
        carrier: "Rychlopost",
        carrierClass: "rp",
        tracking: "RP1005",
        headers: ["Čas skenu", "Událost"],
        rows: [["03.11.2026 08:00", "V přepravě", true]],
        footer: "Zdroj: HTML stránka dopravce po retracku",
        verb: "Nezakládat",
        kind: "stop",
        code: "TRACKING_CARRIER_HAS_IT",
        why: "Mailship status je zastaralý: systém hlásí 'čeká', ale stránka dopravce jasně ukazuje, že zásilka již jede."
      },
      {
        id: "MS-2026-000102",
        label: "Doručeno (B)",
        client: "Lumen obchod",
        state: "převzato dopravcem",
        time: "24 d 1 h 0 min (limit ≥ 14 d)",
        method: "Rychlopost Standard",
        blocks: "žádné",
        rules: "Definice B · ztráta",
        reporter: "Eva Králová (matice)",
        carrier: "Rychlopost",
        carrierClass: "rp",
        tracking: "RP1002",
        headers: ["Čas skenu", "Událost"],
        rows: [["03.11.2026 08:00", "Doručeno příjemci", true]],
        footer: "Zdroj: HTML stránka dopravce po retracku",
        verb: "Nezakládat",
        kind: "stop",
        code: "TRACKING_DELIVERED",
        why: "Ochrana před nejdražší chybou: balíček byl doručen příjemci. Založení reklamace by byla falešná ztráta."
      },
      {
        id: "MS-2026-000103",
        label: "Vrací se (B)",
        client: "Lumen obchod",
        state: "převzato dopravcem",
        time: "24 d 1 h 0 min (limit ≥ 14 d)",
        method: "Rychlopost Standard",
        blocks: "žádné",
        rules: "Definice B · ztráta",
        reporter: "Eva Králová (matice)",
        carrier: "Rychlopost",
        carrierClass: "rp",
        tracking: "RP1003",
        headers: ["Čas skenu", "Událost"],
        rows: [["03.11.2026 08:00", "Zásilka se vrací odesílateli", true]],
        footer: "Zdroj: HTML stránka dopravce po retracku",
        verb: "Nezakládat",
        kind: "stop",
        code: "TRACKING_RETURNING",
        why: "Balíček se vrací do skladu jako vratka. Nejde o ztrátu u dopravce."
      },
      {
        id: "MS-2026-000106",
        label: "Nečitelné (B)",
        client: "Niva studio",
        state: "převzato dopravcem",
        time: "24 d 1 h 0 min (limit ≥ 14 d)",
        method: "PaketNet Standard",
        blocks: "žádné",
        rules: "Definice B · ztráta",
        reporter: "Martin Holub (matice)",
        carrier: "PaketNet",
        carrierClass: "pn",
        tracking: "PN2001",
        emptyTitle: "Neznámá šablona / chybný výstup",
        emptyDesc: "Stránka neobsahuje čitelnou časovou osu ani známé stavové výrazy.",
        footer: "Zdroj: HTML stránka dopravce",
        verb: "Člověk",
        kind: "human",
        code: "TRACKING_UNKNOWN",
        why: "Zdrženlivost: čtečka stav bezpečně nepozná (nevím). Ztráta se automaticky nezakládá a předává referentovi."
      },
      {
        id: "MS-2026-000115",
        label: "Chybí stránka",
        client: "Lumen obchod",
        state: "převzato dopravcem",
        time: "24 d 1 h 0 min (limit ≥ 14 d)",
        method: "Rychlopost Standard",
        blocks: "žádné",
        rules: "Definice B · ztráta",
        reporter: "Eva Králová (matice)",
        carrier: "Rychlopost",
        carrierClass: "rp",
        tracking: "RP1007",
        emptyTitle: "Soubor stránky nenalezen (404 / chybí)",
        emptyDesc: "Tracking stránku se nepodařilo z transportní integrace stáhnout.",
        footer: "Chyba dostupnosti stránky",
        verb: "Člověk",
        kind: "human",
        code: "TRACKING_UNAVAILABLE",
        why: "Nedostupnost trackingu není důkazem ztráty. Případ směřuje na člověka k manuálnímu prověření."
      }
    ];

    const buttonGroup = document.getElementById("buttonGroup");
    const desk = document.getElementById("desk");
    let activeIndex = 0;

    cases.forEach((item, index) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "case-btn";
      btn.textContent = item.label;
      btn.setAttribute("role", "tab");
      btn.setAttribute("aria-selected", index === 0 ? "true" : "false");
      btn.addEventListener("click", () => selectCase(index));
      buttonGroup.appendChild(btn);
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") {
        selectCase((activeIndex + 1) % cases.length);
      } else if (e.key === "ArrowLeft") {
        selectCase((activeIndex - 1 + cases.length) % cases.length);
      }
    });

    function selectCase(index) {
      activeIndex = index;
      [...buttonGroup.children].forEach((b, i) => {
        b.setAttribute("aria-selected", i === index ? "true" : "false");
      });
      render();
    }

    function row(dt, dd) {
      return `<div><dt>${dt}</dt><dd>${dd}</dd></div>`;
    }

    function render() {
      const c = cases[activeIndex];
      let trackingContent = "";

      if (c.emptyTitle) {
        trackingContent = `
          <div class="tracking-fallback-msg">
            <strong>${c.emptyTitle}</strong>
            <span>${c.emptyDesc}</span>
          </div>`;
      } else if (c.rows) {
        const trs = c.rows.map(r => `
          <tr class="${r[2] ? 'active' : ''}">
            <td class="when">${r[0]}</td>
            <td>${r[1]}</td>
          </tr>
        `).join("");

        trackingContent = `
          <table class="events-table">
            <thead>
              <tr>
                <th>${c.headers[0]}</th>
                <th>${c.headers[1]}</th>
              </tr>
            </thead>
            <tbody>${trs}</tbody>
          </table>`;
      }

      desk.innerHTML = `
        <article class="panel">
          <p class="panel-kicker">1. Mailship vstup (Pravidla)</p>
          <h2 class="order-id">${c.id}</h2>
          <p class="client-name">${c.client}</p>
          <dl class="spec-grid">
            ${row("Stav", c.state)}
            ${row("Doba ve stavu", c.time)}
            ${row("Přeprava", c.method)}
            ${row("Pravidla", c.rules)}
            ${row("Blokace", c.blocks)}
            ${row("Reportér", c.reporter)}
          </dl>
        </article>

        <article class="panel">
          <p class="panel-kicker">2. Čerstvý tracking (Zdroj pravdy)</p>
          <div class="carrier-header ${c.carrierClass}">
            <span>${c.carrier}</span>
            <span>Číslo: ${c.tracking}</span>
          </div>
          ${trackingContent}
          <div class="tracking-footer">${c.footer}</div>
        </article>

        <div class="decision-panel ${c.kind}">
          <span class="decision-badge">3. Výsledek brány</span>
          <div class="decision-verb">${c.verb}</div>
          <div class="decision-code">${c.code}</div>
          <p class="decision-why">${c.why}</p>
        </div>
      `;
    }

    render();
  </script>
</body>
</html>
